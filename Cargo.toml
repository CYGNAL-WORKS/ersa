# The Cargo workspace for Ersa's Rust code: Core's crates under `crates/`, and
# the Shell (apps/shell/src-tauri). A workspace shares one `Cargo.lock` and one
# `target/` directory, so all crates build against the same dependency versions
# and Dependabot keeps every one of them in step.

[workspace]
members = ["crates/*", "apps/shell/src-tauri"]
# What a plain `cargo build`, `cargo test` or `cargo clippy` at the root builds:
# Core's crates only, so Tauri is never compiled unless asked for with
# `-p ersa-shell` or `--workspace` (ARCH-CORE-R01). Core must build without
# Tauri or a display; crates/ersa-core/tests/boundaries.rs checks that.
default-members = ["crates/*"]
# Resolver 2 picks dependency features per target and per build kind
# (normal, build script, dev), so a dev-only feature never leaks into release builds.
resolver = "2"

# Metadata every crate inherits with `field.workspace = true`, so the version
# and edition are set in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/CYGNAL-WORKS/ersa"

# Shared dependency versions. A crate opts in with `name.workspace = true`;
# nothing here is compiled unless some crate asks for it.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# Images go to a backend inline as base64 (PROTO-CORE-API, Turns and attachments).
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
# Only the validator: the default features fetch remote schemas over HTTP and
# build a TLS stack, neither of which Ersa wants.
jsonschema = { version = "0.60", default-features = false }
# SQLite for Core's database. `bundled` compiles SQLite from source into the
# binary, so there is no system library to install on Windows.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256, for `workspace.changes`'s token and the content of the files it
# counts.
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# The current UTC time, for timestamps on database rows and raw log lines.
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Random identifiers for projects and workspaces.
uuid = { version = "1", features = ["v4"] }
# Win32 bindings for platform modules only.
windows-sys = "0.61"

# Lints every crate inherits with `[lints] workspace = true`.
# `cargo clippy --all-targets -- -D warnings` turns every warning into an error,
# so anything enabled here must stay clean.
[workspace.lints.rust]
# Unsafe code is allowed only where a platform module needs it, and must be
# opted into explicitly there with `#[allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
# The default clippy set. `priority = -1` lets individual lints be overridden later.
all = { level = "warn", priority = -1 }
