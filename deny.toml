# cargo-deny configuration (ADR 0015). CI runs
#
#   cargo deny --workspace --locked check bans licenses sources
#
# Advisories are deliberately not checked here: OSV-Scanner owns vulnerability
# scanning so that every vulnerability exception lives in deps-policy.toml.

[graph]
# Judge every crate that any feature or platform could pull in, not just the
# ones this machine would build.
all-features = true

[licenses]
# Permissive licences only. An expression such as "MIT OR Apache-2.0" passes
# when any branch is allowed; "A AND B" needs both. Adding a licence here is a
# policy change: say why in the pull request.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: fine to ship unmodified; changing one of its files
    # means publishing that file. Tauri 2 needs it (cssparser, selectors and
    # three others). Owner's decision, issue #20.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# The list is a policy, not an inventory: a licence nothing uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
# Ersa's own crates are `publish = false` (MIT, ADR 0024); they are not judged.
ignore = true

[bans]
# Several versions of one crate cost build time, not safety; Dependabot and
# reviews keep the count down.
multiple-versions = "allow"
# A `*` requirement lets any future release in. Path dependencies between
# Ersa's own crates carry no version and are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
