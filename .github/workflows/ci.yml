# Runs the same checks a session runs locally before committing.
# Linux carries every check because its minutes cost half of Windows'. Windows
# first still holds for the product (CLAUDE.md, Stack): changes to anything Rust
# builds or tests from also run on Windows, which compiles the `cfg(windows)`
# code Linux cannot.
# Actions are pinned by commit SHA (ADR 0015); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build, lint, test, dependencies (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The release-age check reads the lockfiles at the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ keyed on Cargo.lock, so unchanged
      # dependencies are not rebuilt on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Prebuilt binaries at exact versions, verified against checksums.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0

      - name: Format
        run: cargo fmt --check

      # --locked everywhere: CI builds exactly Cargo.lock and never resolves
      # new versions on its own.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Script tests
        run: node --test scripts/deps-check.test.mjs

      - name: Manifest
        run: node scripts/manifest.mjs --check

      # ADR 0015. Release age judges only what a pull request adds or changes,
      # so it has nothing to do on a push. dependencies.yml also runs the
      # vulnerability and cargo-deny checks daily on main.
      - name: Release age
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/deps-check.mjs age --base "origin/$BASE_REF"

      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: node scripts/deps-check.mjs vulns

      - name: Sources, bans, licences
        if: ${{ !cancelled() }}
        run: cargo deny --locked check bans licenses sources

  # Decides whether a pull request, or a push to main, touches anything the
  # Windows build or tests read. A skipped `windows` job still reports a
  # status, so it can be required.
  changes:
    name: Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A push to main can carry several commits; diff from the one before.
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's checkout is its merge commit, whose first parent
          # is the base. --no-renames lists both sides of a rename, so a file
          # moved out of crates/ still counts.
          if [ "$EVENT" = pull_request ]; then
            from=HEAD^1
          else
            from=$BEFORE
          fi
          if ! changed=$(git diff --no-renames --name-only "$from" HEAD); then
            echo "Cannot diff from '$from'; running Windows to be safe."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(crates/|protocol/|docs/briefs/protocol/fixtures/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain|\.?clippy\.toml$|\.?rustfmt\.toml$|deny\.toml$|\.gitattributes$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build, lint, test (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
