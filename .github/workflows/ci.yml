# Runs the same checks a session runs locally before committing.
# Linux carries every check. Windows first still holds for the product
# (CLAUDE.md, Stack): changes to anything Rust builds or tests from also run on
# Windows, which compiles the `cfg(windows)` code Linux cannot.
# Every job runs on a GitHub-hosted runner, free for a public repository and
# thrown away after the job. A fork's pull request runs here too, with a
# read-only token and no secrets; GitHub holds a first-time contributor's run
# until a maintainer approves it (the repository's Actions setting; keep it on).
# The release-age check runs first, so no new dependency's build script or
# install script runs before it passes.
# Actions are pinned by commit SHA (ADR 0015); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's temporary merge of a pull request onto main; the
  # ruleset requires these checks to pass on it before main moves.
  merge_group:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ADR 0015. Judges only what a pull request adds or changes in the
  # lockfiles, reading them at the base branch, so it has nothing to do on a
  # push or in the merge queue, where the pull request already passed it.
  # Every job that builds or installs needs it.
  age:
    name: Release age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Release age
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/deps-check.mjs age --base "origin/$BASE_REF"

  linux:
    name: Build, lint, test, dependencies (Linux)
    needs: age
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Caches the Cargo registry and target/ keyed on Cargo.lock, so
      # unchanged dependencies are not rebuilt on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Prebuilt binaries at exact versions, verified against checksums.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0

      # --all: every workspace member, the Shell included. Formatting needs
      # no build, so Tauri is not compiled.
      - name: Format
        run: cargo fmt --all --check

      # --locked everywhere: CI builds exactly Cargo.lock and never resolves
      # new versions on its own. Plain clippy and test build the workspace's
      # default members, Core's crates, so this job needs none of Tauri's
      # system libraries; the shell job builds the Shell.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Script tests
        # Every script test, found by the shell's glob, so a new test file runs
        # in CI without anyone adding it here. scripts/check.mjs finds the same set.
        run: node --test scripts/*.test.mjs

      - name: Manifest
        run: node scripts/manifest.mjs --check

      # ADR 0015. These read the one Cargo.lock, which covers the Shell too.
      # dependencies.yml also runs them daily on main.
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: node scripts/deps-check.mjs vulns

      - name: Sources, bans, licences
        if: ${{ !cancelled() }}
        run: cargo deny --workspace --locked check bans licenses sources

  # The Interface (apps/shell): generated files current, types, unit tests, and
  # the gallery's screenshot tests. The job runs in the Playwright image the
  # baselines are rendered in (apps/shell/scripts/screenshots-in-container.sh
  # and screenshots.yml, which renders them on GitHub), so its screenshots
  # match them pixel for pixel: same OS, Chromium, fonts and Node. Keep the
  # three image references identical (scripts/render-baselines.test.mjs fails
  # otherwise); a new @playwright/test version in package.json moves all three.
  interface:
    name: Interface (Linux)
    needs: age
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Corepack runs the pnpm that apps/shell/package.json's packageManager
      # names, after checking it against the sha512 there. The corepack Node
      # ships cannot run pnpm 12, so a pinned newer one comes first.
      - name: Install pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable pnpm
          corepack install

      # --frozen-lockfile: install exactly pnpm-lock.yaml, never resolve.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated types, tokens and catalog export are current
        run: pnpm gen:check

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Screenshot tests
        run: pnpm test:screenshots

      # On a screenshot failure, the rendered images: the new baselines when
      # none existed, and the actual and diff images otherwise.
      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            apps/shell/e2e/__screenshots__
            apps/shell/test-results
          if-no-files-found: ignore

  # The Shell's Rust side (apps/shell/src-tauri): a workspace member, but not a
  # default one, so Tauri stays out of Core's build (ARCH-CORE-R01) and this
  # job names it with `-p`. Its bridge tests launch a real ersa-core, built
  # first. Format and dependency checks cover it in the linux job.
  shell:
    name: Shell build, lint, test (Linux)
    needs: age
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The webview and windowing libraries Tauri 2 links against on Linux,
      # and the indicator library its tray icon needs.
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The Shell embeds the Interface's build output (apps/shell/dist) at
      # compile time; these checks need a page there, not the real build.
      - name: Placeholder Interface build
        run: mkdir -p apps/shell/dist && echo '<!doctype html>' > apps/shell/dist/index.html

      - name: Clippy
        run: cargo clippy -p ersa-shell --all-targets --locked -- -D warnings

      - name: Build Core
        run: cargo build -p ersa-cli --locked

      - name: Test
        run: cargo test -p ersa-shell --locked

  # Decides whether a pull request, a merge queue entry, or a push to main
  # touches anything the Windows build or tests read. A skipped `windows` job
  # still reports a status, so it can be required.
  changes:
    name: Rust changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A push to main can carry several commits; diff from the one before.
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # A pull request's checkout is its merge commit, whose first parent
          # is the base; a merge queue entry names the main it was built on.
          # --no-renames lists both sides of a rename, so a file moved out of
          # crates/ still counts.
          case "$EVENT" in
            pull_request) from=HEAD^1 ;;
            merge_group) from=$QUEUE_BASE ;;
            *) from=$BEFORE ;;
          esac
          if ! changed=$(git diff --no-renames --name-only "$from" HEAD); then
            echo "Cannot diff from '$from'; running Windows to be safe."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(crates/|protocol/|docs/briefs/protocol/fixtures/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain|\.?clippy\.toml$|\.?rustfmt\.toml$|deny\.toml$|\.gitattributes$|\.github/workflows/ci\.yml$|apps/shell/src-tauri/)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build, lint, test (Windows)
    needs: [age, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The Shell, as in the Linux shell job; WebView2 ships with Windows.
      - name: Shell clippy
        shell: bash
        run: |
          mkdir -p apps/shell/dist && echo '<!doctype html>' > apps/shell/dist/index.html
          cargo clippy -p ersa-shell --all-targets --locked -- -D warnings

      # bash, so a failed build stops the step (PowerShell would go on).
      - name: Shell test
        shell: bash
        run: |
          cargo build -p ersa-cli --locked
          cargo test -p ersa-shell --locked
