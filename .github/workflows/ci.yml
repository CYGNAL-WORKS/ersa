# Runs the same checks a session runs locally before committing.
# Linux carries every check. Windows first still holds for the product
# (CLAUDE.md, Stack): changes to anything Rust builds or tests from also run on
# Windows, which compiles the `cfg(windows)` code Linux cannot.
# Every job runs on the owner's own machine, registered as self-hosted runners:
# Windows directly, Linux in a WSL Ubuntu 24.04 distro. Jobs wait while that
# machine is offline. A fork's pull request must never run there. The control
# is the repository's Actions setting that runs no workflow for a fork's pull
# request in a private repository (run_workflows_from_fork_pull_requests:
# false); keep it off. Every job's `if`, which skips a fork's pull request and
# any run once the repository is public, is only a backstop: a pull request's
# workflow comes from its own branch, so it holds only for workflows we wrote.
# The release-age check runs first, so no new dependency's build script or
# install script runs before it passes.
# Actions are pinned by commit SHA (ADR 0015); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ADR 0015. Judges only what a pull request adds or changes in the
  # lockfiles, reading them at the base branch, so it has nothing to do on a
  # push. Every job that builds or installs needs it.
  age:
    name: Release age
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      # A home of the job's own, so nothing a job writes under ~ (Cargo's
      # registry, npm, pnpm, corepack) reaches a later one. Rust, Node and
      # Chromium come with the runner, which jobs can't change.
      - name: A home of the job's own
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/runtime"
          chmod 0700 "$RUNNER_TEMP/runtime"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime"
            echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/home/.npm-global"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Release age
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/deps-check.mjs age --base "origin/$BASE_REF"

  linux:
    name: Build, lint, test, dependencies (Linux)
    needs: age
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      # A home of the job's own, so nothing a job writes under ~ (Cargo's
      # registry, npm, pnpm, corepack) reaches a later one. Rust, Node and
      # Chromium come with the runner, which jobs can't change.
      - name: A home of the job's own
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/runtime"
          chmod 0700 "$RUNNER_TEMP/runtime"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime"
            echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/home/.npm-global"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Caches the Cargo registry and target/ keyed on Cargo.lock, so
      # unchanged dependencies are not rebuilt on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Prebuilt binaries at exact versions, verified against checksums.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0

      # --all: every workspace member, the Shell included. Formatting needs
      # no build, so Tauri is not compiled.
      - name: Format
        run: cargo fmt --all --check

      # --locked everywhere: CI builds exactly Cargo.lock and never resolves
      # new versions on its own. Plain clippy and test build the workspace's
      # default members, Core's crates, so this job needs none of Tauri's
      # system libraries; the shell job builds the Shell.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Script tests
        run: node --test scripts/deps-check.test.mjs scripts/check-manifest-hook.test.mjs scripts/pr-queue.test.mjs

      - name: Manifest
        run: node scripts/manifest.mjs --check

      # ADR 0015. These read the one Cargo.lock, which covers the Shell too.
      # dependencies.yml also runs them daily on main.
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: node scripts/deps-check.mjs vulns

      - name: Sources, bans, licences
        if: ${{ !cancelled() }}
        run: cargo deny --workspace --locked check bans licenses sources

  # The Interface (apps/shell): generated files current, types, unit tests, and
  # the gallery's screenshot tests. The runner is Ubuntu 24.04 with the Node,
  # Chromium, and fonts of the Playwright image the baselines come from
  # (apps/shell/playwright.config.ts), so its screenshots match them pixel for
  # pixel without Docker. The runner has the Chromium of the @playwright/test
  # version in package.json; a new version needs the runner updated first.
  interface:
    name: Interface (Linux)
    needs: age
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/shell
    steps:
      # A home of the job's own, so nothing a job writes under ~ (Cargo's
      # registry, npm, pnpm, corepack) reaches a later one. Rust, Node and
      # Chromium come with the runner, which jobs can't change.
      - name: A home of the job's own
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/runtime"
          chmod 0700 "$RUNNER_TEMP/runtime"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime"
            echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/home/.npm-global"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The Node major of the Playwright image in
      # apps/shell/scripts/screenshots-in-container.sh.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Corepack runs the pnpm that apps/shell/package.json's packageManager
      # names, after checking it against the sha512 there. The corepack Node
      # ships cannot run pnpm 12, so a pinned newer one comes first: installed
      # in the job's own npm prefix, which goes ahead of Node's on PATH.
      - name: Install pnpm
        run: |
          npm install --global corepack@0.36.0
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          corepack enable pnpm
          corepack install

      # --frozen-lockfile: install exactly pnpm-lock.yaml, never resolve.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated types and tokens are current
        run: pnpm gen:check

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The gallery server listens on a fixed port (playwright.config.ts), and
      # both runners share the host's network, so one runner at a time.
      - name: Screenshot tests
        run: flock /tmp/ersa-screenshots.lock pnpm test:screenshots

      # On a screenshot failure, the rendered images: the new baselines when
      # none existed, and the actual and diff images otherwise.
      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            apps/shell/e2e/__screenshots__
            apps/shell/test-results
          if-no-files-found: ignore

  # The Shell's Rust side (apps/shell/src-tauri): a workspace member, but not a
  # default one, so Tauri stays out of Core's build (ARCH-CORE-R01) and this
  # job names it with `-p`. Its bridge tests launch a real ersa-core, built
  # first. Format and dependency checks cover it in the linux job. The runner
  # has the webview and windowing libraries Tauri links against.
  shell:
    name: Shell build, lint, test (Linux)
    needs: age
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      # A home of the job's own, so nothing a job writes under ~ (Cargo's
      # registry, npm, pnpm, corepack) reaches a later one. Rust, Node and
      # Chromium come with the runner, which jobs can't change.
      - name: A home of the job's own
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/runtime"
          chmod 0700 "$RUNNER_TEMP/runtime"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime"
            echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/home/.npm-global"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The Shell embeds the Interface's build output (apps/shell/dist) at
      # compile time; these checks need a page there, not the real build.
      - name: Placeholder Interface build
        run: mkdir -p apps/shell/dist && echo '<!doctype html>' > apps/shell/dist/index.html

      - name: Clippy
        run: cargo clippy -p ersa-shell --all-targets --locked -- -D warnings

      - name: Build Core
        run: cargo build -p ersa-cli --locked

      - name: Test
        run: cargo test -p ersa-shell --locked

  # Decides whether a pull request, or a push to main, touches anything the
  # Windows build or tests read. A skipped `windows` job still reports a
  # status, so it can be required.
  changes:
    name: Rust changes
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A push to main can carry several commits; diff from the one before.
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's checkout is its merge commit, whose first parent
          # is the base. --no-renames lists both sides of a rename, so a file
          # moved out of crates/ still counts.
          if [ "$EVENT" = pull_request ]; then
            from=HEAD^1
          else
            from=$BEFORE
          fi
          if ! changed=$(git diff --no-renames --name-only "$from" HEAD); then
            echo "Cannot diff from '$from'; running Windows to be safe."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(crates/|protocol/|docs/briefs/protocol/fixtures/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain|\.?clippy\.toml$|\.?rustfmt\.toml$|deny\.toml$|\.gitattributes$|\.github/workflows/ci\.yml$|apps/shell/src-tauri/)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build, lint, test (Windows)
    needs: [age, changes]
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      # Bash steps run Git Bash. System32's bash.exe, often earlier on PATH,
      # is the WSL launcher; the job puts Git Bash first, so the runner's own
      # PATH does not matter.
      - name: Git Bash first on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The runner runs as the owner, so by default Rust lives in the owner's
      # own ~/.cargo and ~/.rustup: rustup-init would reinstall into them and
      # rust-cache's cleanup would delete the owner's cargo and rustup from
      # ~/.cargo/bin. The job gets its own homes in the runner's tool cache,
      # kept between runs, and never touches the owner's toolchain.
      - name: Rust homes of the runner's own
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE\\ersa-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE\\ersa-rustup" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Never cache or clean the bin folder: on this machine it holds the
          # toolchain the job just installed.
          cache-bin: false

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The Shell, as in the Linux shell job; WebView2 ships with Windows.
      - name: Shell clippy
        shell: bash
        run: |
          mkdir -p apps/shell/dist && echo '<!doctype html>' > apps/shell/dist/index.html
          cargo clippy -p ersa-shell --all-targets --locked -- -D warnings

      # bash, so a failed build stops the step (PowerShell would go on).
      - name: Shell test
        shell: bash
        run: |
          cargo build -p ersa-cli --locked
          cargo test -p ersa-shell --locked
