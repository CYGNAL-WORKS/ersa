# Daily dependency scan of main (ADR 0015). A vulnerability disclosed against
# a version already in use turns this red without anyone touching dependencies;
# docs/dependencies.md says what to do then.
name: Dependencies

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scan:
    name: Daily dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0

      - name: Vulnerabilities
        run: node scripts/deps-check.mjs vulns

      - name: Sources, bans, licences
        if: ${{ !cancelled() }}
        run: cargo deny --workspace --locked check bans licenses sources
