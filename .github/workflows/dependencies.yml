# Daily dependency scan of main (ADR 0015). A vulnerability disclosed against
# a version already in use turns this red without anyone touching dependencies;
# docs/dependencies.md says what to do then.
name: Dependencies

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scan:
    name: Daily dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0

      - name: Vulnerabilities
        run: node scripts/deps-check.mjs vulns

      - name: Sources, bans, licences
        if: ${{ !cancelled() }}
        run: cargo deny --locked check bans licenses sources

      # The Shell is its own Cargo workspace. Licences are left out until
      # deny.toml rules on Tauri's MPL-2.0 crates (docs/briefs/INBOX.md).
      - name: Shell sources, bans
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path apps/shell/src-tauri/Cargo.toml --locked check bans sources
