# The merge review (ADR 0022): once a pull request's CI passes, one Claude Code
# run of the review-pr skill on its head, posted as a review, then the merge
# through scripts/merge-pr.mjs when nothing blocks. The logic is in
# scripts/merge-review.mjs, which has tests; this file is plumbing.
#
# workflow_run, so this file always comes from main; the review script, the
# gate and the hooks are taken from main too, so a pull request cannot change
# its own reviewer. It runs on the owner's Windows machine, where Claude Code
# is installed and logged in; the WSL runners have no login. Every gh and git
# call uses the workflow's token, never the owner's. The job's own check lands
# on main, so the script keeps a "Merge review" check run on the head. A merge
# made with the token fires no workflow, so CI does not run on main after one;
# the gate merges only a head that contains main's tip, so main's tree is the
# head's, which CI tested.
name: Merge review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  actions: read # the gate reads statusCheckRollup, whose query reads each check suite's workflow run
  checks: write
  contents: write
  issues: write # closing the issues a merged pull request fixes
  pull-requests: write

jobs:
  review:
    name: Merge review
    # A CI run on a push to main has no pull request; a failed one needs no
    # review. The private guard is ci.yml's: never a fork on this runner.
    if: >-
      github.event.repository.private &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0] != null))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    # A newer head of the same pull request cancels the review of the older one.
    concurrency:
      group: review-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      # git fetches with the workflow's token through gh, not the owner's
      # stored login; the empty helper resets the list the owner's global
      # config fills.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: "!gh auth git-credential"
    steps:
      # Git Bash first, as the CI workflow does, and claude's install folder,
      # which is not on the runner's PATH.
      - name: Git Bash and claude on PATH
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"

      # The head CI ran on; a manual run reviews the pull request's current head.
      - name: Head to review
        id: head
        env:
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          $sha = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { gh pr view $env:PR --json headRefOid --jq .headRefOid } else { $env:RUN_HEAD }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$sha"

      # The whole history, so origin/main and every reviewed head are here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The review and the gate from main, before either runs; the script takes
      # the hooks and the instruction files from main itself.
      - name: Review logic from main
        run: git checkout origin/main -- scripts/merge-review.mjs scripts/merge-pr.mjs

      - name: Review and merge
        run: node scripts/merge-review.mjs $env:PR --head ${{ steps.head.outputs.sha }}
