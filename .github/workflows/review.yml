# The merge review (ADR 0022): once a pull request's CI passes, one Claude Code
# run of the review-pr skill on its head, posted as a review, then the merge
# through scripts/merge-pr.mjs when nothing blocks. The logic is in
# scripts/merge-review.mjs, which has tests; this file is plumbing.
#
# workflow_run, so the workflow file always comes from main and a pull request
# cannot change its own reviewer. It runs on the owner's Windows machine, where
# Claude Code is installed and logged in; the WSL runners have no login. Every
# gh call uses the workflow's token, never the owner's.
name: Merge review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Merge review
    # A CI run on a push to main has no pull request; a failed one needs no review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    # A newer head of the same pull request cancels the review of the older one.
    concurrency:
      group: review-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Git Bash first, as the CI workflow does, and claude's install folder,
      # which is not on the runner's PATH.
      - name: Git Bash and claude on PATH
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"

      # A manual run reviews the pull request's current head.
      - name: Head of the pull request
        if: github.event_name == 'workflow_dispatch'
        run: Add-Content -Path $env:GITHUB_ENV -Value "HEAD=$(gh pr view $env:PR --json headRefOid --jq .headRefOid)"

      # The whole history, so origin/main and every reviewed head are here. The
      # token stays in the checkout's config: the merge gate fetches with it,
      # and the post step removes it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0

      - name: Review and merge
        run: node scripts/merge-review.mjs $env:PR --head $env:HEAD
