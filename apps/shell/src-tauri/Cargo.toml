# The Shell: Ersa's native window (Tauri 2). It launches or attaches to the
# Core process and bridges the Interface's requests to it (ARCH-CORE, Shell).
#
# A member of the root Cargo workspace, but not one of its default members:
# Core must build without Tauri (ARCH-CORE-R01), so build this crate with
# `cargo build -p ersa-shell` (or `--workspace`). crates/ersa-core/tests/boundaries.rs
# checks Core's dependencies never reach Tauri. This crate may depend on Core's
# crates by path; they never depend on it.

[package]
name = "ersa-shell"
description = "The Ersa window: launches or attaches to Core and bridges the Interface to it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# The executable is `ersa`, the application the user runs.
default-run = "ersa"

[lib]
# A library as well as the executable, so tests/ can drive the bridge without
# a window. `rlib` is Rust's ordinary library format.
name = "ersa_shell"
crate-type = ["rlib"]

[[bin]]
name = "ersa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The verified pipe client (`connect`), the line reader with a length cap, and
# the platform's default endpoint and data directory.
ersa-core = { path = "../../../crates/ersa-core" }
# The JSON-RPC framing and error types of the Core API.
ersa-protocol = { path = "../../../crates/ersa-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tray-icon`: the icon closing the window hides to (FLOW-CLOSE-AND-QUIT).
tauri = { version = "2", features = ["tray-icon"] }
# The system's folder dialog, for adding a project (FLOW-NEW-SESSION-R27);
# the Interface opens it through @tauri-apps/plugin-dialog.
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

# Watching and ending the Core process at Quit, used only by src/process.rs:
# the pipe's server process, and waiting on or terminating it.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The socket's peer process, and signals, used only by src/process.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# A paused clock, so the bridge's tests wait minutes in no time.
tokio = { version = "1", features = ["test-util"] }

# A job object that ends what the tests start when the test run ends, used
# only by tests/common/mod.rs.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# The root workspace's lints (Cargo.toml there).
[lints]
workspace = true
