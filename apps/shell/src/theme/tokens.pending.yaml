# Tokens waiting for a planning commit to add them to docs/design/DESIGN.md (proposed in
# docs/briefs/INBOX.md). Same groups and names as DESIGN.md's front matter; the generator merges
# them in and refuses any DESIGN.md already has. Move each to DESIGN.md and delete it here.
size:
  # The state glyph a tile carries, and the dot before an inline problem.
  glyph: 8px
  # The accent mark beside a chip's chosen option.
  option-mark: 4px
  # The context ring's dial.
  ring: 16px
stack:
  # Custom group. Stacking order, lowest first: a menu sits above the page it opens over.
  menu: 10
shadow:
  # Custom group. The soft, short shadow of a transient layer (menus, popovers, drag previews), built
  # from color roles like `glow`. Light draws it from ink; dark from black, since its canvas is
  # already near black and a shadow drawn from it would not show.
  light:
    transient: "0 4px 12px -4px color-mix(in oklab, {colors.ink} 14%, transparent)"
  dark:
    transient: "0 4px 12px -4px color-mix(in oklab, black 60%, transparent)"
