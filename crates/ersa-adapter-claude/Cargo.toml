[package]
name = "ersa-adapter-claude"
description = "The Claude Code adapter: drives the Claude Code CLI in its streaming JSON mode."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
ersa-adapter = { path = "../ersa-adapter" }
# Only the event types; the projector builds `ersa_protocol::events::Event`s.
ersa-protocol = { path = "../ersa-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Warnings for Core's log, where nothing else reports them.
tracing.workspace = true
# A new session's id, chosen before the CLI starts (`--session-id`).
uuid.workspace = true

# Whether a process named in the CLI's live-session registry is running, used
# only by src/platform.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The fake transport, for the round trip against a stub CLI.
ersa-adapter = { path = "../ersa-adapter", features = ["test-support"] }
# Core, for the tests in tests/through_core/ that drive Claude Code through
# Core's API with Core's own socket test harness.
ersa-core = { path = "../ersa-core" }
# Golden-file tests validate every projected event against the schema.
ersa-protocol = { path = "../ersa-protocol", features = ["schema-validation"] }
# A paused clock, so the model probe's 60-second limit is tested without waiting.
tokio = { workspace = true, features = ["test-util"] }
# Scratch Claude homes for the session-record listing and registry tests.
tempfile.workspace = true
# Captures the adapter's warnings, to check they are logged.
tracing-subscriber.workspace = true

[lints]
workspace = true
