[package]
name = "ersa-cli"
description = "The ersa-core binary: the Core process that the Shell launches or attaches to."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The crate is called `ersa-cli`, but the executable it builds is `ersa-core`,
# the name ADR 0011 gives the Core process.
[[bin]]
name = "ersa-core"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ersa-adapter-claude = { path = "../ersa-adapter-claude" }
ersa-core = { path = "../ersa-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The live smoke test in tests/live.rs talks to the built binary over the
# Core API.
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
