[package]
name = "ersa-core"
description = "Ersa's domain: sessions and their projections, adapters, transports, workspaces, packs, modes, harness tools, and persistence."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
ersa-adapter = { path = "../ersa-adapter" }
ersa-protocol = { path = "../ersa-protocol" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Named pipes and their security descriptor, and job objects that kill
# process trees (with the thread listing that resumes a suspended child),
# used only by src/platform/windows.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# `geteuid` and `kill`, used only by src/platform/unix.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The fake transport, for driving adapters against a scripted process.
ersa-adapter = { path = "../ersa-adapter", features = ["test-support"] }
# The socket-level tests validate every response against the Core API schema.
ersa-protocol = { path = "../ersa-protocol", features = ["schema-validation"] }
tempfile.workspace = true
# A paused clock, so the replay's real-time pacing is tested without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
