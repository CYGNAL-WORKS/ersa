[package]
name = "ersa-core"
description = "Ersa's domain: sessions, raw logs and projections, adapters, transports, workspaces, packs, modes, harness tools, and persistence."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
ersa-adapter = { path = "../ersa-adapter" }
ersa-protocol = { path = "../ersa-protocol" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Named pipes and their security descriptor, and job objects that kill
# process trees, used only by src/platform/windows.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# `geteuid` and `kill`, used only by src/platform/unix.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The socket-level tests validate every response against the Core API schema.
ersa-protocol = { path = "../ersa-protocol", features = ["schema-validation"] }
tempfile.workspace = true
# Used only by tests/boundaries.rs to read the workspace's Cargo.lock.
toml.workspace = true

[lints]
workspace = true
